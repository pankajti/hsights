name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Unit and HTTP tests
        run: python -m unittest discover -s tests -t . -v
      - name: Price panel loads
        run: |
          python - <<'PY'
          from hsights.games.portfolio_challenge.data import price_panel, panel_span
          panel = price_panel()
          assert panel is not None, "bundled price panel missing"
          assert panel.shape[1] >= 40 and len(panel) >= 400, panel.shape
          print("panel ok:", panel.shape, panel_span())
          PY
      - name: Gunicorn boots and serves
        run: |
          gunicorn hsights.server:application --bind 127.0.0.1:8099 \
            --workers 1 --threads 4 --timeout 60 --daemon --pid gunicorn.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8099/healthz
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8099/
          kill "$(cat gunicorn.pid)"
